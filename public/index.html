<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أداة الاتصال</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  background: #0f172a;
  color: #fff;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.card {
  width: min(460px, 100%);
  background: #172033;
  border: 1px solid #29364d;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 20px 60px #0006;
}

h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

.sub {
  color: #aab6ca;
  margin-bottom: 24px;
}

.idbox {
  background: #0b1220;
  border-radius: 18px;
  padding: 18px;
  text-align: center;
  margin-bottom: 18px;
}

.idbox small {
  display: block;
  color: #93a4bd;
  margin-bottom: 6px;
}

.myid {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 8px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #34435d;
  background: #0b1220;
  color: #fff;
  font-size: 22px;
  text-align: center;
  letter-spacing: 6px;
  outline: none;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  background: #fff;
  color: #111827;
}

button.secondary {
  background: #26344b;
  color: #fff;
}

.status {
  margin-top: 18px;
  text-align: center;
  color: #b7c4d9;
  min-height: 24px;
}

.connected {
  color: #7ee787;
}
</style>
</head>

<body>

<main class="card">

<h1>أداة الاتصال</h1>

<div class="sub">
اتصل بشخص آخر باستخدام اليوزر المكوّن من 4 أرقام.
</div>

<div class="idbox">
<small>يوزرك الحالي</small>
<div id="myId" class="myid">----</div>
</div>

<input
  id="target"
  inputmode="numeric"
  maxlength="4"
  placeholder="أدخل يوزر الشخص">

<button id="call">
اتصال
</button>

<button id="hang" class="secondary">
إنهاء الاتصال
</button>

<div id="status" class="status">
جاري الاتصال بالخادم...
</div>

<audio id="remoteAudio" autoplay></audio>

</main>

<script>

let ws;
let pc = null;
let localStream = null;
let currentPeer = null;

const myId = document.getElementById("myId");
const target = document.getElementById("target");
const status = document.getElementById("status");
const callBtn = document.getElementById("call");
const hangBtn = document.getElementById("hang");
const remoteAudio = document.getElementById("remoteAudio");

function setStatus(text, cls = "") {
  status.textContent = text;
  status.className = "status " + cls;
}

function connect() {

  const proto =
    location.protocol === "https:"
      ? "wss"
      : "ws";

  ws = new WebSocket(
    `${proto}://${location.host}/ws`
  );

  ws.onopen = () => {
    setStatus("متصل بالخادم.");
  };

  ws.onclose = () => {

    setStatus(
      "انقطع الاتصال بالخادم — إعادة المحاولة..."
    );

    setTimeout(connect, 1500);
  };

  ws.onerror = () => {
    setStatus("تعذر الاتصال بالخادم.");
  };

  ws.onmessage = async (event) => {

    const m = JSON.parse(event.data);

    if (m.type === "assigned_id") {

      myId.textContent = m.id;

      return;
    }

    if (m.type === "error") {

      setStatus(m.message);

      return;
    }

    if (m.type === "calling") {

      setStatus(
        "جاري الاتصال بـ " + m.target + "..."
      );

      return;
    }

    if (m.type === "incoming_call") {

      currentPeer = m.from;

      const ok = confirm(
        "يوزر " +
        m.from +
        " يتصل بك. قبول الاتصال؟"
      );

      if (ok) {

        ws.send(
          JSON.stringify({
            type: "accept"
          })
        );

        await startPeer(false);

        setStatus(
          "جارٍ بدء الاتصال..."
        );

      } else {

        ws.send(
          JSON.stringify({
            type: "hangup"
          })
        );
      }

      return;
    }

    if (m.type === "call_accepted") {

      setStatus(
        "تم قبول الاتصال — جارٍ فتح الصوت...",
        "connected"
      );

      await startPeer(true);

      return;
    }

    if (m.type === "signal") {

      if (!pc) {
        await startPeer(false);
      }

      const d = m.data;

      try {

        if (d.type === "offer") {

          await pc.setRemoteDescription(d);

          const answer =
            await pc.createAnswer();

          await pc.setLocalDescription(answer);

          ws.send(
            JSON.stringify({
              type: "signal",
              data: pc.localDescription
            })
          );

        } else if (d.type === "answer") {

          await pc.setRemoteDescription(d);

        } else if (d.candidate) {

          await pc.addIceCandidate(d);
        }

      } catch (err) {

        console.error(err);
      }

      return;
    }

    if (
      m.type === "hangup" ||
      m.type === "peer_left"
    ) {

      closePeer();

      setStatus(
        "انتهى الاتصال."
      );
    }
  };
}

async function startPeer(initiator) {

  if (pc) {
    closePeer();
  }

  pc = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      },
      {
        urls: "stun:stun1.l.google.com:19302"
      }
    ]
  });

  pc.onicecandidate = (event) => {

    if (event.candidate) {

      ws.send(
        JSON.stringify({
          type: "signal",
          data: event.candidate
        })
      );
    }
  };

  pc.ontrack = (event) => {

    remoteAudio.srcObject =
      event.streams[0];
  };

  pc.onconnectionstatechange = () => {

    if (
      [
        "failed",
        "disconnected",
        "closed"
      ].includes(pc.connectionState)
    ) {

      setStatus(
        "انقطع الاتصال."
      );
    }

    if (
      pc.connectionState === "connected"
    ) {

      setStatus(
        "متصل بالصوت مباشرة.",
        "connected"
      );
    }
  };

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

    localStream
      .getTracks()
      .forEach(track => {
        pc.addTrack(track, localStream);
      });

  } catch (error) {

    setStatus(
      "اسمح للموقع باستخدام الميكروفون أولاً."
    );

    closePeer();

    return;
  }

  if (initiator) {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(offer);

    ws.send(
      JSON.stringify({
        type: "signal",
        data: pc.localDescription
      })
    );
  }
}

function closePeer() {

  if (pc) {

    pc.close();
    pc = null;
  }

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;
  }

  currentPeer = null;

  remoteAudio.srcObject = null;
}

callBtn.onclick = () => {

  const id =
    target.value.trim();

  if (!/^\d{4}$/.test(id)) {

    setStatus(
      "اكتب يوزر من 4 أرقام."
    );

    return;
  }

  currentPeer = id;

  ws.send(
    JSON.stringify({
      type: "call",
      target: id
    })
  );
};

hangBtn.onclick = () => {

  if (
    ws &&
    ws.readyState === 1
  ) {

    ws.send(
      JSON.stringify({
        type: "hangup"
      })
    );
  }

  closePeer();

  setStatus(
    "تم إنهاء الاتصال."
  );
};

connect();

</script>

</body>
</html>
