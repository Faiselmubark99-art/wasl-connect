<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>وصل Connect</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="container">

    <section id="loginScreen" class="card">

      <div class="logo">📞</div>

      <h1>وصل Connect</h1>

      <p>اتصال صوتي مجاني عبر الإنترنت</p>

      <input
        id="username"
        type="text"
        maxlength="30"
        placeholder="اكتب اسمك"
        autocomplete="off"
      >

      <button id="joinButton">
        دخول
      </button>

      <div id="error"></div>

    </section>


    <section id="appScreen" class="card hidden">

      <header>
        <div>
          <h2>وصل Connect</h2>
          <span id="myName"></span>
        </div>

        <span class="online">
          ● متصل
        </span>
      </header>


      <h3>المستخدمون المتصلون</h3>

      <div id="users"></div>


      <section id="incomingCall" class="callBox hidden">

        <div class="bigIcon">📲</div>

        <h3>مكالمة واردة</h3>

        <p id="callerName"></p>

        <div class="buttons">

          <button id="acceptButton" class="accept">
            قبول
          </button>

          <button id="rejectButton" class="reject">
            رفض
          </button>

        </div>

      </section>


      <section id="activeCall" class="callBox hidden">

        <div class="bigIcon">📞</div>

        <h3 id="activeName"></h3>

        <p id="callStatus">
          جاري الاتصال...
        </p>

        <div class="buttons">

          <button id="muteButton">
            🎙️ كتم
          </button>

          <button id="endButton" class="reject">
            إنهاء المكالمة
          </button>

        </div>

      </section>

    </section>

  </main>

  <audio id="remoteAudio" autoplay></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>

</body>
</html>
