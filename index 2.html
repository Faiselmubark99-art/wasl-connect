<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاتصال الصوتي المتقدم مع الرنين</title>
    <!-- تضمين مكتبة PeerJS للربط السحابي -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 25px; color: var(--primary); }
        .id-box {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn-call { background-color: var(--primary); color: white; }
        .btn-call:hover { background-color: #059669; }
        .btn-hangup { background-color: var(--danger); color: white; display: none; }
        .btn-hangup:hover { background-color: #dc2626; }
        .status { margin-top: 20px; color: #94a3b8; font-size: 14px; }
        audio { display: none; }
        
        /* واجهة رنين مخصصة مدمجة تظهر أعلى الشاشة */
        .ring-overlay {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e293b;
            border: 2px solid var(--primary);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { top: -100px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }
        .ring-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .ring-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .ring-accept { background-color: var(--primary); color: white; }
        .ring-reject { background-color: var(--danger); color: white; }
    </style>
</head>
<body>

<!-- واجهة الرنين العلوية للمكالمات الواردة -->
<div class="ring-overlay" id="ring-ui">
    <h3 style="margin:0 0 10px 0; color: #60a5fa;">📞 مكالمة صوتية واردة...</h3>
    <div id="caller-name" style="font-weight: bold;">جهاز غير معروف يطلب الاتصال بك</div>
    <div class="ring-buttons">
        <button class="ring-btn ring-accept" onclick="acceptIncomingCall()">قبول</button>
        <button class="ring-btn ring-reject" onclick="rejectIncomingCall()">رفض</button>
    </div>
</div>

<div class="container">
    <h1>🎙 نظام الاتصال الصوتي السحابي</h1>
    
    <div>معرّف جهازك الثابت والمميز:</div>
    <div class="id-box" id="my-id">جاري التوليد والاتصال...</div>
    
    <input type="text" id="remote-id" placeholder="أدخل معرّف الجهاز المراد الاتصال به">
    
    <button class="btn btn-call" id="call-btn" onclick="startCall()">📞 بدء المكالمة الصوتية</button>
    <button class="btn btn-hangup" id="hangup-btn" onclick="endCall()">🛑 إنهاء المكالمة</button>
    
    <div class="status" id="status-text">الحالة: جاري تهيئة الاتصال السحابي...</div>
</div>

<!-- عناصر الصوت الخفية لاستقبال المكالمة ونغمة الرنين -->
<audio id="remote-audio" autoplay></audio>
<audio id="ringtone-audio" loop></audio>

<script>
    // 1. توليد يوزر ثابت وحفظه بالجهاز
    let savedId = localStorage.getItem('my_voice_device_id');
    if (!savedId) {
        savedId = 'DEV-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('my_voice_device_id', savedId);
    }
    document.getElementById('my-id').innerText = savedId;

    let localStream;
    let currentCall;
    let pendingCall = null;

    // تجهيز نغمة رنين افتراضية من خادم خارجي مستقر لتعمل تلقائياً
    const ringtone = document.getElementById('ringtone-audio');
    ringtone.src = "https://google.com";

    // طلب إذن الإشعارات من المستخدم فور دخول الموقع ليتمكن من استقبال الاتصال بالخلفية
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    // تفعيل خاصية منع إغلاق الصفحة بالخطأ أثناء العمل
    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = 'ملاحظة: إغلاق الصفحة سيؤدي لقطع الاتصال وعدم استقبال أي مكالمات واردة.';
    });

    // 2. إعداد الاتصال بخوادم PeerJS مع خوادم عبور قوية من جوجل
    const peer = new Peer(savedId, {
        config: {
            'iceServers': [
                { 'urls': 'stun:://google.com' },
                { 'urls': 'stun:://google.com' }
            ]
        }
    });

    peer.on('open', (id) => {
        document.getElementById('status-text').innerText = "الحالة: جاهز تماماً وبانتظار المكالمات";
    });

    // 3. استقبال المكالمات وتشغيل الرنين الفوري المطور
    peer.on('call', (call) => {
        pendingCall = call;
        
        // تشغيل نغمة الرنين الصوتية
        ringtone.play().catch(e => console.log("تحتاج لتفاعل مع الصفحة لتشغيل الصوت تلقائياً"));

        // إظهار واجهة الرنين العلوية بالموقع
        document.getElementById('caller-name').innerText = "الجهاز المتصل: " + call.peer;
        document.getElementById('ring-ui').style.display = 'block';

        // إرسال إشعار للنظام في حال كان المتصفح مصغراً أو في الخلفية
        if (Notification.permission === "granted") {
            const notification = new Notification("📞 مكالمة واردة في أداة الاتصال", {
                body: `الجهاز ${call.peer} يحاول الاتصال بك الآن.`,
                icon: "https://flaticon.com",
                requireInteraction: true // يبقى الإشعار ثابتاً ولا يختفي تلقائياً
            });
            notification.onclick = function() {
                window.focus();
                notification.close();
            };
        }
    });

    // دالة قبول المكالمة من الزر العلوي
    function acceptIncomingCall() {
        stopRingtone();
        if (pendingCall) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then((stream) => {
                localStream = stream;
                pendingCall.answer(stream);
                handleCall(pendingCall);
                pendingCall = null;
            }).catch((err) => {
                alert("فشل الوصول للميكروفون: " + err);
                rejectIncomingCall();
            });
        }
    }

    // دالة رفض المكالمة من الزر العلوي
    function rejectIncomingCall() {
        stopRingtone();
        if (pendingCall) {
            pendingCall.close();
            pendingCall = null;
        }
        document.getElementById('status-text').innerText = "الحالة: تم رفض المكالمة الواردة";
    }

    function stopRingtone() {
        ringtone.pause();
        ringtone.currentTime = 0;
        document.getElementById('ring-ui').style.display = 'none';
    }

    // 4. إجراء مكالمة صادرة للطرف الآخر
    function startCall() {
        const remoteId = document.getElementById('remote-id').value.trim();
        if (!remoteId) {
            alert("يرجى إدخال معرّف الجهاز الآخر أولاً!");
            return;
        }

        document.getElementById('status-text').innerText = "جاري طلب صلاحية الميكروفون والاتصال...";

        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then((stream) => {
            localStream = stream;
            const call = peer.call(remoteId, stream);
            handleCall(call);
        }).catch((err) => {
            document.getElementById('status-text').innerText = "خطأ: لم يتم السماح بالميكروفون";
            alert("يرجى إعطاء صلاحية الميكروفون للموقع لتتمكن من تمرير صوتك.");
        });
    }

    // 5. إدارة مجرى الصوت والتحكم بواجهة المستخدم أثناء المكالمة الحية
    function handleCall(call) {
        currentCall = call;
        document.getElementById('status-text').innerText = "الحالة: متصل الآن (المكالمة جارية...)";
        document.getElementById('call-btn').style.display = 'none';
        document.getElementById('hangup-btn').style.display = 'block';

        call.on('stream', (remoteStream) => {
